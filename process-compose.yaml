# Sunday supervision stack — run with `devbox services up`.
#
# ONE process: the parent. It binds the receiver, supervises a `gh webhook forward`
# per routed repo IN-PROCESS and then boots — so there is nothing left for a second
# supervised process to depend on, and no launcher script between them (#40). The relay's
# recovery lives in `services/github/forwarder.mts`, which is what lets a dropped
# forwarder alert a human and catch its repo up; process-compose (v1.110) only ever LOGS
# a failed probe, which is how the 2026-07-24 outage ran 8h44m unnoticed.
#
# Runs as a supervised HOST process (not a container). It spawns sandcastle Docker
# sandboxes on the host daemon directly, exactly as a hand-run `npm run sunday` does — so
# there is no docker-out-of-docker path translation to get right.
#
#   devbox services up            # foreground, the process + a TUI
#   devbox services up -b          # background
#   devbox services attach         # re-attach to the running TUI / logs
#   devbox services stop           # stop the stack
#
# Singleton rule: the queue, the claim label and the parent's own children assume ONE
# process. process-compose RESTARTS it on death but never replicates it — do not add
# replicas.
version: "0.5"

processes:
  # The singleton parent. On every (re)start it re-arms a persisted pause/halt, resolves
  # what the last parent left behind and re-derives outstanding work from GitHub, so a
  # crash-restart is a delay, not a loss. `restart: always` is the self-heal.
  #
  # SIGTERM is the stop that matters: the parent SIGTERMs its forwarders on it, so `gh`
  # removes its own dev webhook instead of stranding it for the next start to trip over.
  sunday:
    command: "node --env-file=.env main.mts"
    availability:
      restart: "always"
      backoff_seconds: 5
    # The receiver's GET endpoint 200s once it's serving, which is BEFORE the boot
    # sequence runs — image builds take minutes and a probe unanswered for that long is
    # the SIGKILL/restart loop ADR-0001 exists to stop. process-compose probes support
    # http_get / exec (NOT k8s-style tcp_socket — that leaves a process forever
    # un-Ready). Keep the port in sync with LISTENER_PORT (.env, default 8787) — probe
    # ports are ints, so it can't read the env var here.
    readiness_probe:
      http_get:
        host: "127.0.0.1"
        scheme: http
        path: "/"
        port: 8787
      initial_delay_seconds: 1
      period_seconds: 5
      timeout_seconds: 3
      failure_threshold: 3
